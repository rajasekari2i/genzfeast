uried.\u003c/div>\n      \u003c/div>\n      \u003cdiv style=\"background: #FFFFFF; border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 8px; border: 1px solid #F1E6DA\">\n        \u003cdiv style=\"font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 20px\">Sold out is obvious\u003c/div>\n        \u003cdiv style=\"font-size: 13px; line-height: 20px; color: #5B5866\">Greyed photo, a stamp and a disabled button — not a faint dim.\u003c/div>\n      \u003c/div>\n    \u003c/div>\n  \u003c/div>\n\n  \u003cdiv style=\"display: flex; gap: 40px\">\n    \u003cdiv style=\"flex: 1; display: flex; flex-direction: column; gap: 14px\">\n      \u003cdiv style=\"font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: #5B5866\">Colour\u003c/div>\n      \u003cdiv style=\"display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px\">\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\u003cdiv style=\"height: 88px; border-radius: 18px; background: {{brand}}\">\u003c/div>\u003cdiv style=\"font-size: 13px; font-weight: 600\">Tangerine\u003c/div>\u003cdiv style=\"font-size: 12px; color: #5B5866\">Brand · per tenant\u003c/div>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\u003cdiv style=\"height: 88px; border-radius: 18px; background: #2B1D16\">\u003c/div>\u003cdiv style=\"font-size: 13px; font-weight: 600\">Espresso #2B1D16\u003c/div>\u003cdiv style=\"font-size: 12px; color: #5B5866\">Text, primary CTA\u003c/div>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direction: column; gap: 8px\">\u003cdiv style=\"height: 88px; border-radius: 18px; background: #FFF8F1; border: 1px solid #EADBCB\">\u003c/div>\u003cdiv style=\"font-size: 13px; font-weight: 600\">Cream #FFF8F1\u003c/div>\u003cdiv style=\"font-size: 12px; color: #5B5866\">App ground\u003c/div>\u003c/div>\n        \u003cdiv style=\"display: flex; flex-direc CLogic);\n  var vals = new Comp(props).renderVals() || {};\n  function ev(expr, scope){\n    var keys = Object.keys(scope);\n    try { return new Function(keys.join(','), 'return (' + expr + ');').apply(null, keys.map(function(k){ return scope[k]; })); }\n    catch(e){ return ''; }\n  }\n  var RE = /{{([^}]+)}}/g;\n  function interp(str, scope){ return str.replace(RE, function(_, e){ var v = ev(e.trim(), scope); return v == null ? '' : String(v); }); }\n  function processChildren(parent, scope){ Array.prototype.slice.call(parent.childNodes).forEach(function(n){ processNode(n, scope); }); }\n  function processNode(n, scope){\n    if (n.nodeType === 3) { if (n.nodeValue.indexOf('{{') >= 0) n.nodeValue = interp(n.nodeValue, scope); return; }\n    if (n.nodeType !== 1) return;\n    var tag = n.tagName.toLowerCase();\n    if (tag === 'sc-for') {\n      var list = ev(n.getAttribute('list').replace(/^{{|}}$/g, '').trim(), scope) || [];\n      var as = n.getAttribute('as');\n      var frag = document.createDocumentFragment();\n      list.forEach(function(item, i){\n        var s = Object.assign({}, scope); s[as] = item; s.index = i;\n        var holder = document.createElement('div');\n        Array.prototype.slice.call(n.childNodes).forEach(function(c){ holder.appendChild(c.cloneNode(true)); });\n        processChildren(holder, s);\n        while (holder.firstChild) frag.appendChild(holder.firstChild);\n      });\n      n.parentNode.replaceChild(frag, n); return;\n    }\n    if (tag === 'sc-if') {\n      var ok = ev(n.getAttribute('value').replace(/^{{|}}$/g, '').trim(), scope);\n      if (!ok) { n.parentNode.removeChild(n); return; }\n      processChildren(n, scope);\n      var f = document.createDocumentFragment();\n      while (n.firstChild) f.appendChild(n.firstChild);\n      n.parentNode.replaceChild(f, n); return;\n    }\n    Array.prototype.slice.call(n.attributes).forEach(function(a){\n      if (a.value.indexOf('{{') \u003c 0) return;\n      var whole = a.value.match(/^{{([^}]+)}}$/);\n      if (whole) {\n        var v = ev(whole[1].trim(), scope);\n        if (v === true) n.setAttribute(a.name, '');\n        else if (v === false || v == null) n.removeAttribute(a.name);\n        else n.setAttribute(a.name, String(v));\n      } else n.setAttribute(a.name, interp(a.value, scope));\n    });\n    processChildren(n, scope);\n  }\n  var root = document.getElementById('root');\n  root.appendChild(document.importNode(tpl.content, true));\n  processChildren(root, vals);\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a');\n    if (a) { e.preventDefault(); var h = a.getAttribute('href') || ''; var m = h.match(/([A-Za-z]+)\\.dc\\.html/); if (m) parent.postMessage({ goto: m[1] }, '*'); }\n  });\n  document.addEventListener('submit', function(e){ e.preventDefault(); });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},"items":[{"id":"Dashboard","title":"Company Admin · Dashboard","w":390,"h":844,"doc":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400..700&amp;display=swap\">\n\u003cstyle>\nbody{margin:0}\na{color:#2B1D16}a:hover{color:#183153}\n\u003c/style>\n\u003cstyle>a{cursor:pointer}\u003c/style>\u003c/head>\u003cbody>\u003ctemplate id=\"tpl\">\n\n\u003cdiv style=\"width: 390px; height: 844px; box-sizing: border-box; background: #F5F3EF; color: #2B1D16; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden\">\n\n  \u003cdiv style=\"background: #183153; color: #FFFFFF; border-radius: 0 0 32px 32px; padding: 14px 20px 26px; display: flex; flex-direction: column; gap: 20px\">\n    \u003cdiv style=\"display: flex; align-items: center; gap: 10px\">\n      \u003ca href=\"AdminDrawer.dc.html\" aria-label=\"Open menu\" style=\"width: 44px; height: 44px; border-r props = props || {}; } renderVals(){ return {}; } }\n  var tpl = document.getElementById('tpl');\n  var cfg = JSON.parse(document.getElementById('cfg').textContent);\n  var props = {};\n  Object.keys(cfg.props || {}).forEach(function(k){ if (k[0] !== '$' && cfg.props[k] && 'default' in cfg.props[k]) props[k] = cfg.props[k].default; });\n  var Comp = new Function('DCLogic', cfg.code + '\\n;return Component;')(DCLogic);\n  var vals = new Comp(props).renderVals() || {};\n  function ev(expr, scope){\n    var keys = Object.keys(scope);\n    try { return new Function(keys.join(','), 'return (' + expr + ');').apply(null, keys.map(function(k){ return scope[k]; })); }\n    catch(e){ return ''; }\n  }\n  var RE = /{{([^}]+)}}/g;\n  function interp(str, scope){ return str.replace(RE, function(_, e){ var v = ev(e.trim(), scope); return v == null ? '' : String(v); }); }\n  function processChildren(parent, scope){ Array.prototype.slice.call(parent.childNodes).forEach(function(n){ processNode(n, scope); }); }\n  function processNode(n, scope){\n    if (n.nodeType === 3) { if (n.nodeValue.indexOf('{{') >= 0) n.nodeValue = interp(n.nodeValue, scope); return; }\n    if (n.nodeType !== 1) return;\n    var tag = n.tagName.toLowerCase();\n    if (tag === 'sc-for') {\n      var list = ev(n.getAttribute('list').replace(/^{{|}}$/g, '').trim(), scope) || [];\n      var as = n.getAttribute('as');\n      var frag = document.createDocumentFragment();\n      list.forEach(function(item, i){\n        var s = Object.assign({}, scope); s[as] = item; s.index = i;\n        var holder = document.createElement('div');\n        Array.prototype.slice.call(n.childNodes).forEach(function(c){ holder.appendChild(c.cloneNode(true)); });\n        processChildren(holder, s);\n        while (holder.firstChild) frag.appendChild(holder.firstChild);\n      });\n      n.parentNode.replaceChild(frag, n); return;\n    }\n    if (tag === 'sc-if') {\n      var ok = ev(n.getAttribute('value').replace(/^{{|}}$/g, '').trim(), scope);\n      if (!ok) { n.parentNode.removeChild(n); return; }\n      processChildren(n, scope);\n      var f = document.createDocumentFragment();\n      while (n.firstChild) f.appendChild(n.firstChild);\n      n.parentNode.replaceChild(f, n); return;\n    }\n    Array.prototype.slice.call(n.attributes).forEach(function(a){\n      if (a.value.indexOf('{{') \u003c 0) return;\n      var whole = a.value.match(/^{{([^}]+)}}$/);\n      if (whole) {\n        var v = ev(whole[1].trim(), scope);\n        if (v === true) n.setAttribute(a.name, '');\n        else if (v === false || v == null) n.removeAttribute(a.name);\n        else n.setAttribute(a.name, String(v));\n      } else n.setAttribute(a.name, interp(a.value, scope));\n    });\n    processChildren(n, scope);\n  }\n  var root = document.getElementById('root');\n  root.appendChild(document.importNode(tpl.content, true));\n  processChildren(root, vals);\n  document.addEventListener('click', function(e){\n    var a = e.target.closest && e.target.closest('a');\n    if (a) { e.preventDefault(); var h = a.getAttribute('href') || ''; var m = h.match(/([A-Za-z]+)\\.dc\\.html/); if (m) parent.postMessage({ goto: m[1] }, '*'); }\n  });\n  document.addEventListener('submit', function(e){ e.preventDefault(); });\n})();\n\u003c/script>\u003c/body>\u003c/html>"},{"id":"AdminDrawer","title":"Company Admin · Side menu","w":390,"h":844,"doc":"\u003c!doctype html>\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&amp;family=Inter:wght@400..700&amp;display=swap\">\n\u003cstyle>\nbody{margin:0}\na{color:#FFFFFF}a:hover{color:#FFC857}\n\u003c/style>\n\u003cstyle>a{cursor:pointer}\u003c/style>\u003c/head>\u003cbody>\u003ctemplate id=\"tpl\">\n\n\u003cdiv style=\"position: relative; width: 390px; height: 844px; background: #F5F3EF; font-family: Inter, system-ui, sans-serif; overflow: hidden\">\n  \
