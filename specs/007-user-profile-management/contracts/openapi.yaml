openapi: 3.0.3
info:
  title: GenzFeast — User Profile API
  version: "1.0.0"
  description: >
    Contract for feature 007-user-profile-management. Every endpoint acts
    only on the caller's own account (identity from the verified JWT, per
    specs/002-registration-login-jwt-auth) — none takes a user id parameter,
    since no cross-user access exists in this feature (FR-014).

servers:
  - url: https://api.genzfeast.example/v1

security:
  - bearerAuth: []

tags:
  - name: Profile

paths:
  /me/profile:
    get:
      tags: [Profile]
      summary: View the caller's own profile
      responses:
        "200":
          description: Profile, shaped by the caller's role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
    patch:
      tags: [Profile]
      summary: >
        Update the caller's own Name and Email (all roles) and Department
        (Student only). All-or-nothing (FR-007) — Username and Category are
        never accepted here regardless of role.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileUpdateRequest" }
      responses:
        "200":
          description: Profile updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "400": { $ref: "#/components/responses/ValidationError" }

  /me/change-password:
    post:
      tags: [Profile]
      summary: Change the caller's own password (distinct from the OTP-based forgot-password flow)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ChangePasswordRequest" }
      responses:
        "200":
          description: Password changed; other sessions revoked (FR-012)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ChangePasswordAck" }
        "400":
          description: New password and confirmation did not match (FR-010) — rejected before checking current password
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "401":
          description: Current password did not match (FR-011) — nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }

  /me/delete-account:
    post:
      tags: [Profile]
      summary: >
        Permanently close the caller's own account. Required by Google
        Play's User Data policy, which obliges any app offering account
        creation to offer in-app account deletion.
      description: >
        POST rather than DELETE so the password confirmation travels in a
        request body every proxy and client handles consistently, and to
        match /me/change-password's shape in the same controller.

        The account row itself is soft-deleted (`is_deleted`), per this
        repository's never-hard-delete convention — orders, payment
        attempts and audit rows reference it with onDelete: Restrict, and
        order history must survive for financial/legal retention. Every
        personal field on the surviving row (name, username — which is the
        10-digit mobile number, email, gender, password hash, outstanding
        reset-OTP state) is overwritten at the same time, so the retained
        reference carries no personal data.

        Every refresh token is revoked and every device_registrations row
        removed, so no session continues and no further FCM push can reach
        the account. The mobile number is freed immediately for a fresh
        registration: both username unique indexes are partial on
        `is_deleted = false`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeleteAccountRequest" }
      responses:
        "204":
          description: Account closed. Every session is revoked — the caller's own tokens are already invalid.
        "401":
          description: Current password did not match — nothing changed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "409":
          description: >
            An order is paid for and still awaiting pickup
            (order_placed/order_ready). Deliberately the only blocking
            state: it resolves as soon as Staff hands the order over.
            Unpaid payment_pending/payment_failed orders never block,
            since a diner cannot cancel one and would otherwise be
            permanently unable to close their account.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }


components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    ValidationError:
      description: Request failed field-level validation (e.g., invalid email format, department not in caller's own company)

  schemas:
    Profile:
      type: object
      description: Fields present depend on role — category/department only for a student, company only for company_admin/company_staff
      properties:
        name: { type: string, description: "Read-only (FR-008)" }
        username: { type: string, description: "Read-only (FR-003)" }
        email: { type: string, format: email }
        role: { type: string, enum: [system_admin, company_admin, company_staff, student, teaching, non_teaching] }
        category:
          type: string
          nullable: true
          description: "Student only, read-only (FR-005)"
        department:
          type: string
          nullable: true
          description: "Student only, editable (FR-005)"
        company:
          type: string
          nullable: true
          description: "company_admin/company_staff only, read-only (FR-002); absent for system_admin"

    ProfileUpdateRequest:
      type: object
      description: Any subset of these fields; department is rejected for non-Student roles
      properties:
        name:
          type: string
          minLength: 1
          description: "The caller's own display name. Accepted for every role. Username and Category remain read-only and are rejected outright."
        email: { type: string, format: email }
        department_id:
          type: string
          format: uuid
          description: "Student only — must belong to the caller's own company (research.md §3)"

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password, retype_password]
      properties:
        current_password: { type: string, format: password }
        new_password: { type: string, format: password }
        retype_password: { type: string, format: password }
        refresh_token:
          type: string
          description: >
            Optional — the caller's own current-session refresh token, to
            preserve that one session from revocation (research.md §2).
            If omitted, every session (including the current one) is
            revoked, matching 003's password-reset behavior.

    ChangePasswordAck:
      type: object
      properties:
        message: { type: string, example: "Password updated. You've been logged out of other devices." }

    DeleteAccountRequest:
      type: object
      required: [current_password]
      properties:
        current_password:
          type: string
          format: password
          description: >
            Re-confirms the caller owns the account before an
            irreversible action, so a briefly unattended or stolen session
            cannot close it.

    ErrorResponse:
      type: object
      properties:
        message: { type: string }
