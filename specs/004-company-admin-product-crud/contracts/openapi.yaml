openapi: 3.0.3
info:
  title: GenzFeast — Company Admin Product Management API
  version: "1.0.0"
  description: >
    Contract for feature 004-company-admin-product-crud. All endpoints
    require Authorization: Bearer <access_token> (see
    specs/002-registration-login-jwt-auth). company_id is always taken from
    the verified JWT claim, never from the request body or path. Full CRUD
    is Company-Admin-only; PATCH .../soldout is additionally available to
    Staff (FR-012). No endpoint here is reachable by System Admin — this
    feature grants no cross-tenant Product access (FR-003).

servers:
  - url: https://api.genzfeast.example/v1

security:
  - bearerAuth: []

tags:
  - name: Products

paths:
  /tenant/products:
    get:
      tags: [Products]
      summary: >
        List the caller's own company's active products (Company Admin or
        Staff). Server-side paginated (revised — this task's own explicit
        ask: 10 per page, fetch the next page on scroll) with an optional
        name search filter.
      parameters:
        - $ref: "#/components/parameters/PageParam"
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/SearchParam"
      responses:
        "200":
          description: A page of the caller's company products, sold-out items clearly flagged
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaginatedProductsResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [Products]
      summary: Create a new product scoped to the caller's own company (Company Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCreateRequest" }
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /tenant/products/{productId}:
    get:
      tags: [Products]
      summary: >
        Not in this feature's original scope — added once `list` became
        paginated, so the edit screen can look up one product directly
        rather than fetch-the-full-list-and-find-by-id (Company Admin or
        Staff).
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "200":
          description: The product
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [Products]
      summary: Update a product's Name, Description, Image, Price, and/or Veg/Non-Veg indicator (Company Admin only)
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductUpdateRequest" }
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400": { $ref: "#/components/responses/ValidationError" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [Products]
      summary: Soft-delete a product (Company Admin only) — removed from active list, existing references remain valid
      parameters:
        - $ref: "#/components/parameters/ProductId"
      responses:
        "204": { description: Product soft-deleted }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/products/{productId}/soldout:
    patch:
      tags: [Products]
      summary: Toggle sold-out status only, independent of every other field (Company Admin or Staff — FR-012)
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_soldout]
              properties:
                is_soldout: { type: boolean }
      responses:
        "200":
          description: Sold-out status updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /tenant/products/{productId}/image:
    post:
      tags: [Products]
      summary: >
        Upload or replace a product's photo (Company Admin only). Required
        on every product going forward — the mobile Create/Edit form's own
        Save flow calls this immediately after creating (or when editing,
        alongside updating) the product. JPEG or PNG only, max 2MB. Stored
        in a Supabase Storage bucket named by the caller's own company_id
        (created automatically on first upload for that Company) — response
        carries only the resulting public URL.
      parameters:
        - $ref: "#/components/parameters/ProductId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [image]
              properties:
                image: { type: string, format: binary, description: "JPEG or PNG, max 2MB" }
      responses:
        "200":
          description: Image stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "400":
          description: Missing file, wrong type (not JPEG/PNG), or over the 2MB limit
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorResponse" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ProductId:
      name: productId
      in: path
      required: true
      schema: { type: string, format: uuid }
    PageParam:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    LimitParam:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, maximum: 50, default: 10 }
    SearchParam:
      name: search
      in: query
      required: false
      description: Case-insensitive name substring filter
      schema: { type: string }

  responses:
    Forbidden:
      description: Caller's role/company scope does not permit this action
    NotFound:
      description: Product does not exist, belongs to a different company, or has been removed
    ValidationError:
      description: Request failed field-level validation (e.g., missing Name, Price <= 0)

  schemas:
    ErrorResponse:
      type: object
      properties:
        message: { type: string, example: "Image exceeds the maximum allowed size (2MB)" }

    Product:
      type: object
      properties:
        id: { type: string, format: uuid }
        company_id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        image_url: { type: string, format: uri, nullable: true }
        price: { type: integer, description: "Whole-number amount in the smallest currency unit", example: 4000 }
        is_veg: { type: boolean }
        is_soldout: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProductCreateRequest:
      type: object
      required: [name, description, price, is_veg]
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 1 }
        is_veg: { type: boolean }
        is_soldout: { type: boolean, description: "Optional; defaults to false per FR-005" }

    ProductUpdateRequest:
      type: object
      description: Any subset of these fields; omitted fields are left unchanged (FR-007)
      properties:
        name: { type: string }
        description: { type: string }
        price: { type: integer, minimum: 1 }
        is_veg: { type: boolean }
        is_soldout:
          type: boolean
          description: >
            Not in this endpoint's original scope — the mobile Create/Edit
            form now shows this toggle directly, in addition to the
            dedicated PATCH .../soldout endpoint.

    PaginatedProductsResponse:
      type: object
      description: Server-side pagination (10 per page) — the mobile list screen fetches the next page on scroll.
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Product" }
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
